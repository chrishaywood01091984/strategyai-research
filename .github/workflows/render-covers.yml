name: Render newsletter covers

on:
  workflow_dispatch:
  push:
    paths:
      - 'linkedin/covers/**'
      - 'linkedin/render-covers.js'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chrome system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 fonts-liberation
      - name: Install deps
        working-directory: linkedin
        run: npm install
      - name: Render covers
        working-directory: linkedin
        run: node render-covers.js
      - name: Commit covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add linkedin/covers
          git commit -m "Render newsletter cover options [skip ci]" || echo "nothing to commit"
          git push
