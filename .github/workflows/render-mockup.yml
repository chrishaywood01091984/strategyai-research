name: Render mobile mockup

# Renders the "In your pocket" mobile mockup scene into a PNG entirely in GitHub Actions.
# Nothing is rendered on any local machine. Output committed back with [skip ci].

on:
  workflow_dispatch:
  push:
    paths:
      - 'linkedin/mockup/**'
      - 'linkedin/render-mockup.js'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 fonts-liberation

      - name: Install deps (puppeteer downloads Chrome)
        working-directory: linkedin
        run: npm install

      - name: Render mockup
        working-directory: linkedin
        run: node render-mockup.js

      - name: Commit rendered mockup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add linkedin/mockup
          git commit -m "Render mobile mockup PNG [skip ci]" || echo "nothing to commit"
          git push
