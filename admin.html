<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research — Moderation</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/assets/style.css?v=8">
</head>
<body>
<nav class="nav"><div class="wrap">
  <a class="brand" href="https://strategyai.co.uk">STRATEGYAI</a>
  <div class="navlinks"><a href="/" class="active">Research</a><a href="#" id="signout" style="display:none">Sign out</a></div>
</div></nav>

<header class="hero"><div class="wrap" style="padding:54px 28px 40px">
  <div class="kicker">MODERATION</div>
  <h1 class="title" style="font-size:clamp(30px,4vw,46px)">Review <em>queue</em>.</h1>
  <p class="lead">Approve or reject contributor submissions. Only StrategyAI admins can see this.</p>
</div></header>

<main class="wrap" style="padding:30px 28px 90px">
  <div id="signin" class="panel" style="max-width:520px;margin:0 auto">
    <div class="field"><label>Admin key</label><input id="secret" type="password" placeholder="Enter your moderation key" autocomplete="off"></div>
    <button class="btn btn-solid" id="unlock">Unlock queue</button>
    <div id="msg" class="hint" style="margin-top:12px"></div>
  </div>
  <div id="queue" style="display:none"></div>
</main>

<script src="/assets/config.js?v=8"></script>
<script src="/assets/app.js?v=8"></script>
<script>
const $=id=>document.getElementById(id);
const FN=`${SUPA.url}/functions/v1/research`;
function secret(){return localStorage.getItem('sa_admin_secret')||''}
async function callFn(payload){
  const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({...payload,secret:secret()})});
  return {ok:r.ok,status:r.status,data:await r.json().catch(()=>({}))};
}
$('unlock').addEventListener('click',()=>{
  const s=$('secret').value.trim(); if(!s){$('msg').textContent='Enter your key.';return;}
  localStorage.setItem('sa_admin_secret',s); loadQueue();
});
$('signout').addEventListener('click',e=>{e.preventDefault();localStorage.removeItem('sa_admin_secret');location.reload();});

async function setStatus(id,decision){
  const {ok}=await callFn({action:'moderate',id,decision});
  if(ok) loadQueue(); else alert('Update failed.');
}
window.setStatus=setStatus;

async function loadQueue(){
  if(!secret()){$('signin').style.display='';$('queue').style.display='none';$('signout').style.display='none';return;}
  const {ok,status,data}=await callFn({action:'list'});
  if(!ok){
    $('msg').textContent = status===401 ? 'Wrong key.' : 'Could not load queue.';
    localStorage.removeItem('sa_admin_secret');
    $('signin').style.display='';$('queue').style.display='none';return;
  }
  $('signin').style.display='none';$('queue').style.display='';$('signout').style.display='';
  const posts=data.posts||[];
  if(!posts.length){$('queue').innerHTML='<div class="panel" style="text-align:center">Nothing pending. You\'re all caught up.</div>';return;}
  $('queue').innerHTML=posts.map(p=>`
    <div class="panel" style="margin-bottom:18px;max-width:none">
      <div style="font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ice);text-transform:uppercase">${esc(p.category)} · ${esc(p.author_name||'')} · ${esc(p.author_email||'')} · ${(p.created_at||'').slice(0,10)}</div>
      <h2 style="font-family:var(--serif);color:#fff;margin:8px 0 10px">${esc(p.title)}</h2>
      <div style="color:var(--ice);white-space:pre-wrap;max-height:240px;overflow:auto;font-size:14px;line-height:1.7;border-left:2px solid var(--border);padding-left:14px">${esc(p.body_md)}</div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-solid" onclick="setStatus('${p.id}','approve')">Approve &amp; publish</button>
        <button class="btn btn-ghost" onclick="setStatus('${p.id}','reject')">Reject</button>
      </div>
    </div>`).join('');
}
loadQueue();
</script>
</body>
</html>
